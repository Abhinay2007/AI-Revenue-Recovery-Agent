[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-revenue-recovery-backend"
version = "0.1.0"
description = "Foundation backend for the AI Revenue Recovery Agent hackathon project."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "groq>=1.7.0,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "scikit-learn>=1.5.0",
    "SQLAlchemy>=2.0.32",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

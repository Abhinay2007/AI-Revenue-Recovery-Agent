services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: revenue_user
      POSTGRES_PASSWORD: revenue_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue_user -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
      build:
        context: .
        dockerfile: docker/backend.Dockerfile
      environment:
        APP_ENV: development
        LOG_LEVEL: INFO
        DATABASE_URL: postgresql+psycopg://revenue_user:revenue_password@postgres:5432/revenue_recovery
        DATASET_PATH: /app/data/generated/orders.csv
        ARTIFACT_PATH: /app/data/generated/models/rto_predictor.joblib

        LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
        LLM_MODEL: ${LLM_MODEL:-llama3.2:latest}
        LLM_API_KEY: ${LLM_API_KEY:-}
        LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
        OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
        RAZORPAY_ENABLED: ${RAZORPAY_ENABLED:-false}
        RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
        RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
        RAZORPAY_REQUEST_TIMEOUT_SECONDS: ${RAZORPAY_REQUEST_TIMEOUT_SECONDS:-10}
        RAZORPAY_TEST_ORDER_ID: ${RAZORPAY_TEST_ORDER_ID:-}
      ports:
        - "8000:8000"
      extra_hosts:
        - "host.docker.internal:host-gateway"
      depends_on:
        postgres:
          condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
